syntax = "proto3";

package sanctum.v1;

service Sanctum {
  rpc GetRuntimeInfo(Empty) returns (RuntimeInfo);
  rpc CreateCollection(CreateCollectionRequest) returns (Collection);
  rpc UpdateCollection(UpdateCollectionRequest) returns (Collection);
  rpc DeleteCollection(DeleteCollectionRequest) returns (Empty);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc UploadText(stream UploadTextFrame) returns (TextRevision);
  rpc SubmitText(stream UploadTextFrame) returns (IngestionJob);
  rpc GetIngestionJob(IngestionJobRequest) returns (IngestionJob);
  rpc ListIngestionJobs(ListIngestionJobsRequest) returns (ListIngestionJobsResponse);
  rpc GetEmbeddingStatus(EmbeddingStatusRequest) returns (EmbeddingStatus);
  rpc CancelIngestionJob(IngestionJobRequest) returns (IngestionJob);
  rpc RetryIngestionJob(IngestionJobRequest) returns (IngestionJob);
  rpc GetLocalQueue(Empty) returns (LocalQueueStatus);
  rpc SetLocalQueue(SetLocalQueueRequest) returns (LocalQueueStatus);
  rpc ScanPendingText(ScanPendingTextRequest) returns (stream PendingTextScanEvent);
  rpc SearchText(SearchTextRequest) returns (SearchTextResponse);
  rpc SearchCollections(SearchCollectionsRequest) returns (SearchTextResponse);
  rpc FetchChunk(FetchChunkRequest) returns (TextHit);
  rpc FetchContext(FetchContextRequest) returns (TextContext);
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  rpc GetSource(GetSourceRequest) returns (GetSourceResponse);
  rpc DeleteSource(DeleteSourceRequest) returns (DeletedSource);
  rpc ImportLocal(ImportLocalRequest) returns (stream ImportLocalEvent);
  rpc ImportUrl(ImportUrlRequest) returns (ImportUrlResponse);
  rpc ImportGit(ImportGitRequest) returns (stream ImportGitEvent);
  rpc WatchFolder(WatchFolderRequest) returns (WatchedFolder);
  rpc ListWatchedFolders(ListWatchedFoldersRequest) returns (ListWatchedFoldersResponse);
  rpc UnwatchFolder(UnwatchFolderRequest) returns (Empty);
  rpc GetMetadata(MetadataTarget) returns (MetadataResponse);
  rpc MutateMetadata(MutateMetadataRequest) returns (MetadataResponse);
  rpc QueryMetadata(QueryMetadataRequest) returns (QueryMetadataResponse);
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  rpc WatchChanges(ListChangesRequest) returns (stream ListChangesResponse);
  rpc GetChangeCursor(ChangeCursorRequest) returns (ChangeCursor);
  rpc GetStorageUsage(StorageUsageRequest) returns (StorageUsage);
  rpc OpenDatabaseSession(DatabaseTarget) returns (DatabaseSession);
  rpc QueryDatabase(QueryDatabaseRequest) returns (QueryDatabaseResponse);
  rpc DownloadDatabase(DatabaseSessionRef) returns (stream DatabaseFrame);
  rpc CloseDatabaseSession(DatabaseSessionRef) returns (Empty);
}

message Empty {}

// Effective settings exposed by the running process. Credentials and connection
// details are excluded. Health describes the API process.
message RuntimeInfo {
  string version = 1;
  string status = 2;
  string storage = 3;
  string role = 4;
  uint64 max_source_bytes = 5;
  optional uint32 local_worker_concurrency = 6;
  optional uint64 snapshot_cache_bytes = 7;
  bool mcp = 8;
  bool cloud_task_dispatch = 9;
  optional string embedding_profile_id = 10;
  optional uint32 embedding_dimensions = 11;
  repeated string capabilities = 12;
  bool url_imports = 13;
  uint32 chunk_window_bytes = 14;
  uint32 chunk_overlap_bytes = 15;
}

message DatabaseTarget {
  string tenant = 1;
  // Omit to select the tenant catalog.
  optional string collection = 2;
}

message DatabaseSessionRef {
  DatabaseTarget target = 1;
  string generation = 2;
}

message DatabaseSchemaObject {
  string kind = 1;
  string name = 2;
  string table = 3;
  string sql = 4;
}

message DatabaseSession {
  DatabaseSessionRef session = 1;
  uint64 expires_at_unix_ms = 2;
  uint64 bytes = 3;
  uint32 schema_version = 4;
  string sqlite_version = 5;
  repeated DatabaseSchemaObject schema = 6;
  repeated string sqlite_features = 7;
  // Published object-backed generation pinned by the session, when applicable.
  optional string snapshot_generation = 8;
}

message SqlValue {
  oneof value {
    Empty null = 1;
    sint64 integer = 2;
    double real = 3;
    string text = 4;
    bytes blob = 5;
  }
}

message QueryDatabaseRequest {
  DatabaseSessionRef session = 1;
  string sql = 2;
  repeated SqlValue parameters = 3;
  uint64 offset = 4;
  optional uint32 limit = 5;
}

message SqlRow {
  repeated SqlValue values = 1;
}

message QueryDatabaseResponse {
  repeated string columns = 1;
  repeated SqlRow rows = 2;
  optional uint64 next_offset = 3;
}

message DatabaseFrame {
  bytes data = 1;
}

message StorageUsageRequest {
  oneof scope {
    Scope collection = 1;
    string tenant = 2;
    Empty cluster = 3;
  }
}

message StorageUsage {
  StorageUsageRequest scope = 1;
  uint64 bytes = 2;
  uint64 files = 3;
  uint64 started_at_unix_ms = 4;
  uint64 finished_at_unix_ms = 5;
}

message MetadataTarget {
  Scope scope = 1;
  // Omit source to target collection metadata. A source always needs a revision.
  optional string source_id = 2;
  optional string revision_id = 3;
  optional uint64 chunk_ordinal = 4;
}

message MetadataEntry {
  string namespace = 1;
  string key = 2;
  // UTF-8 JSON, including scalar and null values.
  string value_json = 3;
}

message MetadataMutation {
  string namespace = 1;
  string key = 2;
  oneof edit {
    string set_json = 3;
    string merge_patch_json = 4;
    Empty remove = 5;
  }
}

message MutateMetadataRequest {
  MetadataTarget target = 1;
  repeated MetadataMutation edits = 2;
}

message MetadataResponse {
  repeated MetadataEntry entries = 1;
}

message MetadataField {
  MetadataLevel level = 1;
  string namespace = 2;
  string key = 3;
  repeated MetadataPathSegment path = 4;
}

message MetadataList {
  MetadataField sort_by = 1;
  bool descending = 2;
}

message MetadataCount {
  MetadataField group_by = 1;
}

message QueryMetadataRequest {
  string tenant = 1;
  // Set for source or chunk targets. Collection targets query the tenant catalog.
  optional string collection = 2;
  MetadataLevel level = 3;
  MetadataFilter filter = 4;
  oneof view {
    MetadataList list = 5;
    MetadataCount count = 6;
  }
  uint32 offset = 7;
  optional uint32 limit = 8;
}

message MetadataMatch {
  MetadataTarget target = 1;
  // Absent for missing values or lists without a sort field.
  optional string value_json = 2;
}

message MetadataGroup {
  // Absent for the missing-value group or a count without grouping.
  optional string value_json = 1;
  uint64 count = 2;
}

message QueryMetadataResponse {
  repeated MetadataMatch matches = 1;
  repeated MetadataGroup groups = 2;
  optional uint32 next_offset = 3;
}

message ListChangesRequest {
  Scope scope = 1;
  uint64 after_cursor = 2;
  optional uint32 limit = 3;
}

message ChangeCursorRequest {
  Scope scope = 1;
}

message ChangeCursor {
  uint64 cursor = 1;
}

message SourceChange {
  uint64 cursor = 1;
  string kind = 2;
  string source_id = 3;
  string revision_id = 4;
  optional string previous_revision_id = 5;
  optional uint64 chunk_ordinal = 6;
}

message ListChangesResponse {
  repeated SourceChange changes = 1;
  uint64 next_cursor = 2;
}

enum IngestionState {
  INGESTION_STATE_UNSPECIFIED = 0;
  INGESTION_STATE_ACCEPTED = 1;
  INGESTION_STATE_INDEXING = 2;
  INGESTION_STATE_PUBLISHING = 3;
  INGESTION_STATE_TEXT_READY = 4;
  INGESTION_STATE_FAILED = 5;
  INGESTION_STATE_CANCELED = 6;
  INGESTION_STATE_EXTRACTING = 7;
  // The hosted collection writer ordered the revision. Indexing is pending.
  INGESTION_STATE_REGISTERED = 8;
}

message IngestionJobRequest {
  Scope scope = 1;
  string operation_id = 2;
}

message ListIngestionJobsRequest {
  string tenant = 1;
  optional string collection = 2;
  optional uint32 limit = 3;
  optional string before_operation_id = 4;
}

message ListIngestionJobsResponse {
  repeated IngestionJob jobs = 1;
  optional string next_before_operation_id = 2;
}

message IngestionJob {
  Scope scope = 1;
  string operation_id = 2;
  // Empty while a hosted replacement by external reference awaits registration.
  string source_id = 3;
  string revision_id = 4;
  string name = 5;
  ExternalSource external = 6;
  uint64 total_bytes = 7;
  uint64 processed_bytes = 8;
  uint32 attempts = 9;
  IngestionState state = 10;
  optional string error_code = 11;
  optional string error_message = 12;
  optional TextRevision text_revision = 13;
  uint64 update_sequence = 14;
  uint64 created_at_unix_seconds = 15;
  UrlProvenance url = 16;
  GitProvenance git = 17;
}

message LocalQueueStatus {
  bool paused = 1;
}

message SetLocalQueueRequest {
  bool paused = 1;
}

message Scope {
  string tenant = 1;
  string collection = 2;
}

message CreateCollectionRequest {
  Scope scope = 1;
  // Hosted storage replays a matching request ID after an ambiguous failure.
  optional string request_id = 2;
}

message DeleteCollectionRequest {
  Scope scope = 1;
  optional string request_id = 2;
}

message UpdateCollectionRequest {
  Scope scope = 1;
  string display_name = 2;
}

message Collection {
  Scope scope = 1;
  // Catalog reads and updates populate these fields.
  optional string display_name = 2;
  optional uint64 created_at_unix_seconds = 3;
}

message ListCollectionsRequest {
  string tenant = 1;
  optional string after = 2;
  optional uint32 limit = 3;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
  optional string next_after = 2;
}

message ExternalSource {
  string namespace = 1;
  string id = 2;
}

message UploadTextHeader {
  Scope scope = 1;
  string name = 2;
  ExternalSource external = 3;
  Replacement replacement = 4;
  // Retain the original after extraction. UTF-8 input shares its canonical file.
  bool retain_original = 5;
  // Optional nonzero UUID for replaying hosted submissions within a collection.
  optional string request_id = 6;
  // Namespaced JSON values attached to the new source revision on publication.
  repeated MetadataEntry source_metadata = 7;
}

message Replacement {
  // When absent, resolve the target using UploadTextHeader.external.
  optional string source_id = 1;
  optional string expected_revision_id = 2;
}

message ListSourcesRequest {
  Scope scope = 1;
  optional string after_source_id = 2;
  optional uint32 limit = 3;
}

message ListSourcesResponse {
  repeated TextRevision sources = 1;
  optional string next_after_source_id = 2;
  optional string database_generation = 3;
}

message GetSourceRequest {
  Scope scope = 1;
  string source_id = 2;
  optional string expected_revision_id = 3;
}

message GetSourceResponse {
  TextRevision current_revision = 1;
  optional string database_generation = 2;
}

message DeleteSourceRequest {
  Scope scope = 1;
  string source_id = 2;
  optional string expected_revision_id = 3;
  // Optional idempotency key for a hosted deletion.
  optional string request_id = 4;
}

message DeletedSource {
  string source_id = 1;
  string revision_id = 2;
}

message ImportLocalRequest {
  Scope scope = 1;
  // Path on the local server's filesystem.
  string path = 2;
  repeated string include = 3;
  repeated string exclude = 4;
  bool prune_missing = 5;
  bool retain_original = 6;
}

message ImportUrlRequest {
  Scope scope = 1;
  string url = 2;
  bool retain_original = 3;
}

message UrlProvenance {
  string requested_url = 1;
  string final_url = 2;
  optional string etag = 3;
  optional string last_modified = 4;
  optional string content_type = 5;
}

message ImportUrlResponse {
  ImportState state = 1;
  string source_id = 2;
  string revision_id = 3;
  optional string operation_id = 4;
  // Observed during this request, including when the bytes were unchanged.
  UrlProvenance url = 5;
}

message ImportGitRequest {
  Scope scope = 1;
  oneof repository {
    string local_path = 2;
    string https_url = 3;
  }
  // Defaults to HEAD. Use a full ref or a full local commit ID.
  string reference = 4;
  repeated string include = 5;
  repeated string exclude = 6;
  bool prune_missing = 7;
  bool retain_original = 8;
}

message GitProvenance {
  string repository = 1;
  string reference = 2;
  string commit = 3;
  string path = 4;
  string blob = 5;
}

message ImportGitEvent {
  ImportLocalEvent file = 1;
  // Present for files observed in the selected commit.
  GitProvenance git = 2;
}

message WatchFolderRequest {
  Scope scope = 1;
  string path = 2;
  repeated string include = 3;
  repeated string exclude = 4;
  bool prune_missing = 5;
  bool retain_original = 6;
  optional uint32 interval_seconds = 7;
}

message ListWatchedFoldersRequest {
  Scope scope = 1;
  optional string after_id = 2;
  optional uint32 limit = 3;
}

message ListWatchedFoldersResponse {
  repeated WatchedFolder folders = 1;
  optional string next_after_id = 2;
}

message UnwatchFolderRequest {
  Scope scope = 1;
  string id = 2;
}

message WatchedFolder {
  string id = 1;
  WatchFolderRequest definition = 2;
  optional uint64 last_scan_at_unix_seconds = 3;
  uint64 last_queued = 4;
  uint64 last_missing = 5;
  uint64 last_deleted = 6;
  uint64 last_failed = 7;
  optional string last_error = 8;
}

enum ImportState {
  IMPORT_STATE_UNSPECIFIED = 0;
  IMPORT_STATE_QUEUED = 1;
  IMPORT_STATE_PENDING = 2;
  IMPORT_STATE_UNCHANGED = 3;
  IMPORT_STATE_MISSING = 4;
  IMPORT_STATE_DELETED = 5;
  IMPORT_STATE_FAILED = 6;
}

message ImportLocalEvent {
  string path = 1;
  ImportState state = 2;
  optional string source_id = 3;
  optional string revision_id = 4;
  optional string operation_id = 5;
  optional string message = 6;
}

message UploadTextEnd {}

// Send a header, data frames of at most 256 KiB, then one end frame and EOF.
message UploadTextFrame {
  oneof frame {
    UploadTextHeader header = 1;
    bytes data = 2;
    UploadTextEnd end = 3;
  }
}

// Successful UploadText responses describe a committed lexical revision.
message TextRevision {
  Scope scope = 1;
  string source_id = 2;
  string revision_id = 3;
  string name = 4;
  ExternalSource external = 5;
  uint64 bytes = 6;
  uint64 chunks = 7;
  string content_blake3 = 8;
  string original_blake3 = 9;
  string source_encoding = 10;
  optional string extractor = 11;
  bool retain_original = 12;
  UrlProvenance url = 13;
  GitProvenance git = 14;
  string chunker = 15;
}

// Bounded, case-sensitive scan of the staged UTF-8 input for one pending job.
message ScanPendingTextRequest {
  IngestionJobRequest job = 1;
  string literal = 2;
  // Defaults to 1048576. Maximum 33554432.
  optional uint64 byte_limit = 3;
  // Defaults to 10. Maximum 100.
  optional uint32 hit_limit = 4;
}

message PendingTextScanSource {
  Scope scope = 1;
  string operation_id = 2;
  // Empty until registration resolves a replacement by external identity.
  optional string source_id = 3;
  string revision_id = 4;
  string name = 5;
  ExternalSource external = 6;
  uint64 total_bytes = 7;
}

message PendingTextMatch {
  uint64 start_byte = 1;
  uint64 end_byte = 2; // Exclusive.
}

enum PendingTextScanStop {
  PENDING_TEXT_SCAN_STOP_UNSPECIFIED = 0; // More progress to follow.
  PENDING_TEXT_SCAN_STOP_COMPLETE = 1;
  PENDING_TEXT_SCAN_STOP_BYTE_LIMIT = 2;
  PENDING_TEXT_SCAN_STOP_HIT_LIMIT = 3;
  PENDING_TEXT_SCAN_STOP_INVALID_TEXT = 4;
  PENDING_TEXT_SCAN_STOP_EXTRACTION_PENDING = 5;
}

message PendingTextScanProgress {
  uint64 scanned_bytes = 1;
  repeated PendingTextMatch matches = 2;
  PendingTextScanStop stop = 3;
  // Cumulative bytes actually read, including the current buffer's lookahead.
  uint64 read_bytes = 4;
}

message PendingTextScanEvent {
  oneof event {
    PendingTextScanSource source = 1;
    PendingTextScanProgress progress = 2;
  }
}

message SearchTextRequest {
  Scope scope = 1;
  string query = 2;
  optional uint32 limit = 3;
  MetadataFilter metadata_filter = 4;
  SearchMode mode = 5;
}

enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_LEXICAL = 1;
  SEARCH_MODE_SEMANTIC = 2;
  SEARCH_MODE_HYBRID = 3;
}

message MetadataFilter {
  oneof expression {
    MetadataPredicate test = 1;
    MetadataFilterGroup all = 2;
    MetadataFilterGroup any = 3;
    MetadataFilter not = 4;
  }
}

message MetadataFilterGroup {
  repeated MetadataFilter filters = 1;
}

message MetadataPathSegment {
  oneof segment {
    string property = 1;
    uint32 index = 2;
  }
}

enum MetadataLevel {
  METADATA_LEVEL_UNSPECIFIED = 0;
  METADATA_LEVEL_COLLECTION = 1;
  METADATA_LEVEL_SOURCE = 2;
  METADATA_LEVEL_CHUNK = 3;
}

enum MetadataOperator {
  METADATA_OPERATOR_UNSPECIFIED = 0;
  METADATA_OPERATOR_EQUAL = 1;
  METADATA_OPERATOR_LESS = 2;
  METADATA_OPERATOR_LESS_OR_EQUAL = 3;
  METADATA_OPERATOR_GREATER = 4;
  METADATA_OPERATOR_GREATER_OR_EQUAL = 5;
  METADATA_OPERATOR_CONTAINS = 6;
  METADATA_OPERATOR_EXISTS = 7;
  METADATA_OPERATOR_MISSING = 8;
}

message MetadataPredicate {
  MetadataLevel level = 1;
  string namespace = 2;
  string key = 3;
  repeated MetadataPathSegment path = 4;
  MetadataOperator operator = 5;
  optional string operand_json = 6;
}

message SearchTextResponse {
  repeated TextHit hits = 1;
  SearchMode mode = 2;
  EmbeddingCoverage embedding_coverage = 3;
  optional string degraded_reason = 4;
}

message SearchCollectionsRequest {
  string tenant = 1;
  repeated string collections = 2;
  string query = 3;
  optional uint32 limit = 4;
  MetadataFilter metadata_filter = 5;
  SearchMode mode = 6;
}

message EmbeddingCoverage {
  optional string profile_id = 1;
  uint64 total_chunks = 2;
  uint64 embedded_chunks = 3;
  uint64 failed_chunks = 4;
}

message EmbeddingStatusRequest {
  Scope scope = 1;
  // Supply both IDs to inspect a current source revision. Omit both for the collection.
  optional string source_id = 2;
  optional string revision_id = 3;
}

message EmbeddingStatus {
  EmbeddingCoverage coverage = 1;
  uint64 retrying_chunks = 2;
  optional uint64 next_retry_at_unix_seconds = 3;
  optional string sample_error = 4;
}

message ChunkRef {
  Scope scope = 1;
  string source_id = 2;
  string revision_id = 3;
  uint64 ordinal = 4;
}

message FetchChunkRequest {
  ChunkRef chunk = 1;
}

message FetchContextRequest {
  ChunkRef chunk = 1;
  // Up to 16384 bytes per side, trimmed inward at UTF-8 boundaries.
  uint32 before_bytes = 2;
  uint32 after_bytes = 3;
}

message TextContext {
  TextHit hit = 1;
  uint64 start_byte = 2;
  uint64 end_byte = 3; // Exclusive.
  string text = 4;
}

message HitMetadataEntry {
  MetadataLevel level = 1;
  MetadataEntry entry = 2;
}

enum ChunkEmbeddingState {
  CHUNK_EMBEDDING_STATE_UNSPECIFIED = 0;
  CHUNK_EMBEDDING_STATE_DISABLED = 1;
  CHUNK_EMBEDDING_STATE_PENDING = 2;
  CHUNK_EMBEDDING_STATE_READY = 3;
  CHUNK_EMBEDDING_STATE_RETRYING = 4;
  CHUNK_EMBEDDING_STATE_FAILED = 5;
}

message TextHit {
  ChunkRef chunk = 1;
  string name = 2;
  ExternalSource external = 3;
  uint64 start_byte = 4;
  uint64 end_byte = 5; // Exclusive.
  string excerpt = 6;
  string content_blake3 = 7;
  optional double score = 8;
  // The immutable hosted collection snapshot used to resolve this hit.
  optional string database_generation = 9;
  string representation = 10;
  repeated HitMetadataEntry metadata = 11;
  bool metadata_omitted = 12;
  // State of this chunk's input in the active profile's embedding cache.
  ChunkEmbeddingState embedding_state = 13;
}
