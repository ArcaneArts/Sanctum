[package]
name = "sanctum-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
http = ["dep:axum", "dep:tokio-util", "rmcp/macros", "rmcp/transport-streamable-http-server"]
bridge = ["dep:anyhow", "dep:reqwest-mcp", "rmcp/client", "rmcp/transport-io", "rmcp/transport-streamable-http-client-reqwest"]

[dependencies]
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
reqwest-mcp = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server"] }
sanctum-core = { path = "../sanctum-core" }
sanctum-service = { path = "../sanctum-service" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true
